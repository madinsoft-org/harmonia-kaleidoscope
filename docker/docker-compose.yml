version: '3.8'

services:
  harmonia:
    image: harmonia:${IMAGE_TAG}
    networks:
      - public
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - harmonia_sqlite_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.harmonia.rule=Host(`madinapp.fr`) && PathPrefix(`/harmonia`)"
        - "traefik.http.routers.harmonia.entrypoints=websecure"
        - "traefik.http.routers.harmonia.tls.certresolver=myresolver"
        - "traefik.http.middlewares.strip-harmonia.stripprefix.prefixes=/harmonia"
        - "traefik.http.routers.harmonia.middlewares=strip-harmonia"
        - "traefik.http.services.harmonia.loadbalancer.server.port=3000"

networks:
  public:
    external: true

volumes:
  harmonia_sqlite_data: